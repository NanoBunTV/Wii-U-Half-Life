// Test helpers for renderer checks without a save file. Copy to sd:/wiiu/apps/halflife/valve/gxtest.cfg
// and start with, in cmdline.txt (one line):
//   +sv_cheats 1 +exec gxtest.cfg +map c2a3 +w100 +w100 +w100 +gxfire
// c2a3 starts facing a wall: gxfire gives all weapons and holds MP5 fire at it (bullet decals, sparks).
// +map c4a1 (Xen) shakes the ground right at the start (GamePad rumble).
// Waits count frames, so the timing stretches with a low frame rate.

alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"

// all weapons, MP5, fire for about 2 seconds at 60 FPS
alias gxfire "impulse 101;w100;weapon_9mmAR;w100;+attack;w100;-attack"

// same, then turn right and fire again
alias gxshoot "impulse 101;w100;weapon_9mmAR;w100;+attack;w100;-attack;w10;+right;w100;w10;w10;w10;w10;w10;-right;w100;+attack;w10;w10;w10;-attack"
